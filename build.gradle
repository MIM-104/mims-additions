apply from: 'gradle/scripts/dependencies.gradle'

// Local quest edits take priority; clean checkouts use the committed pack files.
def useTrackedPackFiles = providers.gradleProperty('useTrackedPackFiles').map { it.toBoolean() }.getOrElse(false)
def packSource = { String path ->
    def localFile = file("run/${path}")
    !useTrackedPackFiles && localFile.isFile() ? localFile : file("pack/${path}")
}
def coinScripts = ['coins.zs', 'coin_conversions.zs', 'coins_actuallyadditions.zs', 'coins_misc.zs']
def questDatabaseToPackage = packSource('config/betterquesting/DefaultQuests.json')
def packagedQuestDatabase = layout.buildDirectory.file('generated/questbook/DefaultQuests.json')
def preparePackagedQuestDatabase = tasks.register('preparePackagedQuestDatabase') {
    inputs.file(questDatabaseToPackage)
    outputs.file(packagedQuestDatabase)
    outputs.upToDateWhen { false }

    doLast {
        if (!questDatabaseToPackage.isFile()) {
            throw new GradleException("Missing saved Better Questing database: ${questDatabaseToPackage}")
        }

        logger.lifecycle("Packaging the latest saved in-game questbook from ${questDatabaseToPackage}")
        def questDatabase = new groovy.json.JsonSlurper().parse(questDatabaseToPackage)
        int restoredPlaceholderItems = 0
        int restoredPlaceholderFluids = 0
        def restorePlaceholderReferences
        restorePlaceholderReferences = { value ->
            if (value instanceof Map) {
                if (value['id:8'] == 'betterquesting:placeholder') {
                    def originalItem = value['tag:10']
                    if (!(originalItem instanceof Map)
                            || !(originalItem['orig_id:8'] instanceof String)
                            || originalItem['orig_id:8'].trim().isEmpty()
                            || !(originalItem['orig_meta:3'] instanceof Number)) {
                        throw new GradleException(
                                "Cannot restore a Better Questing placeholder item: ${groovy.json.JsonOutput.toJson(value)}")
                    }

                    value['id:8'] = originalItem['orig_id:8']
                    value['Damage:2'] = originalItem['orig_meta:3']
                    value.remove('tag:10')
                    restoredPlaceholderItems++
                }

                if (value['FluidName:8'] == 'betterquesting.placeholder') {
                    def originalFluid = value['Tag:10']
                    if (!(originalFluid instanceof Map)
                            || !(originalFluid['orig_id:8'] instanceof String)
                            || originalFluid['orig_id:8'].trim().isEmpty()) {
                        throw new GradleException(
                                "Cannot restore a Better Questing placeholder fluid: ${groovy.json.JsonOutput.toJson(value)}")
                    }

                    value['FluidName:8'] = originalFluid['orig_id:8']
                    value.remove('Tag:10')
                    restoredPlaceholderFluids++
                }

                value.values().each { child -> restorePlaceholderReferences(child) }
            } else if (value instanceof List) {
                value.each { child -> restorePlaceholderReferences(child) }
            }
        }
        restorePlaceholderReferences(questDatabase)

        def outputFile = packagedQuestDatabase.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(questDatabase)) + '\n',
                'UTF-8')

        logger.lifecycle("Prepared Better Questing database for the mod JAR; restored "
                + "${restoredPlaceholderItems} missing-mod item and ${restoredPlaceholderFluids} fluid references "
                + "across ${questDatabase['questDatabase:9'].size()} quests.")
    }
}

tasks.register('syncPackSources') {
    group = 'build'
    description = 'Saves the current questbook and bundled coin scripts as portable build inputs.'
    dependsOn preparePackagedQuestDatabase
    doLast {
        copy {
            from packagedQuestDatabase
            into 'pack/config/betterquesting'
        }
        copy {
            from coinScripts.collect { packSource("scripts/${it}") }
            into 'pack/scripts'
        }
    }
}

// Adds Access Transformer files to tasks
if (propertyBool('use_access_transformer')) {
    for (def location : propertyStringList('access_transformer_locations')) {
        def fileLocation = file("${projectDir}/src/main/resources/${location}")
        if (fileLocation.exists()) {
            tasks.deobfuscateMergedJarToSrg.accessTransformerFiles.from(fileLocation)
            tasks.srgifyBinpatchedJar.accessTransformerFiles.from(fileLocation)
        } else {
            throw new GradleException("Access Transformer file [$fileLocation] does not exist!")
        }
    }
}

jar {
    manifest {
        attributes(
                "FMLCorePlugin": "com.example.modid.core.ModidCoremod",
                "FMLCorePluginContainsFMLMod": "true"
        )
    }
}


processResources {
    dependsOn preparePackagedQuestDatabase
    from(packagedQuestDatabase) {
        into 'betterquesting'
    }
    from(coinScripts.collect { packSource("scripts/${it}") }) {
        into 'scripts'
    }

    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')
    inputs.property 'mixin_refmap', propertyString('mixin_refmap')
    inputs.property 'mixin_package', propertyString('mixin_package')
    inputs.property 'mixin_configs', propertyStringList('mixin_configs').join(' ')

    def filterList = ['mcmod.info', 'pack.mcmeta']
    filterList.addAll(propertyStringList('mixin_configs').collect(config -> "mixins.${config}.json" as String))

    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'mixin_refmap': propertyString('mixin_refmap'),
                'mixin_package': propertyString('mixin_package')
        )
    }

    if (propertyBool('use_access_transformer')) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }

}


jar {
    // Handle duplicate files - exclude the first occurrence
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        def attribute_map = [:]
        if (propertyBool('is_coremod')) {
            attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            if (propertyBool('coremod_includes_mod')) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
                def currentTasks = gradle.startParameter.taskNames
                if (currentTasks[0] == 'build' || currentTasks[0] == 'prepareObfModsFolder' || currentTasks[0] == 'runObfClient') {
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
        }
        if (propertyBool('use_access_transformer')) {
            attribute_map['FMLAT'] = propertyString('access_transformer_locations')
        }
        // ModidCoremod and LateMixin register the early and late configurations with MixinBooter.
        // Do not also queue the obsolete, unsplit mixins.modid.json from the JAR manifest.
        attributes(attribute_map)
    }

    // Add all embedded dependencies into the jar
    from(provider{ configurations.embed.collect {it.isDirectory() ? it : zipTree(it)} }) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}





idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/mixins.${config}.json").exists())
    onlyIf {
        if (propertyBool('use_mixins') && propertyBool('generate_mixins_json')) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/mixins.${mixinConfig}.json")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${propertyString('mixin_refmap')}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax')) {
        if (it.name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
    dependsOn 'injectTags', 'generateMixinJson'
}

if (propertyBool('use_modern_java_syntax')) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

tasks.named('injectTags', InjectTagsTask).configure {
    onlyIf {
        return propertyBool('use_tags') && !it.getTags().get().isEmpty()
    }
    it.outputClassName.set(propertyString('tag_class_name'))
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'

// File-level quest update checks do not launch Minecraft or touch any player save.
sourceSets {
    questInstallerCheck {
        java.srcDir 'src/verification/java'
        compileClasspath = sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath = output + sourceSets.main.output + configurations.runtimeClasspath
    }
}
tasks.register('verifyQuestInstaller', JavaExec) {
    dependsOn questInstallerCheckClasses
    classpath = sourceSets.questInstallerCheck.runtimeClasspath
    mainClass = 'com.example.modid.common.BundledQuestInstallerCheck'
    args layout.buildDirectory.get().asFile.absolutePath
}
tasks.named('check') { dependsOn 'verifyQuestInstaller' }
